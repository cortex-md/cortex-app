appId: app.cortex.desktop
productName: Cortex
copyright: Copyright © Cortex
directories:
  output: release
  buildResources: build
files:
  - out/**/*
  - "!out/**/*.map"
  - package.json
asar: true
asarUnpack:
  - node_modules/font-list/**
compression: maximum
electronLanguages:
  - en
  - en-US
  - en-GB
  - pt
  - pt-BR
electronFuses:
  runAsNode: false
  enableCookieEncryption: true
  enableNodeOptionsEnvironmentVariable: false
  enableNodeCliInspectArguments: false
  enableEmbeddedAsarIntegrityValidation: true
  onlyLoadAppFromAsar: true
protocols:
  - name: Cortex
    schemes:
      - cortex
mac:
  category: public.app-category.productivity
  target:
    - dmg
    - zip
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  notarize: false
win:
  target:
    - nsis
linux:
  target:
    - AppImage
    - deb
  category: Office
publish:
  provider: github
  owner: cortex-md
  repo: cortex-app
