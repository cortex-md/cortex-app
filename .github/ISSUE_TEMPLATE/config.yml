blank_issues_enabled: false
contact_links:
  - name: Vote on the roadmap
    url: https://cortex-md.tech/roadmap
    about: See what shipped, what is in progress, and what is planned. Vote with a 👍 on the issue behind each card.
  - name: Report a plugin or theme
    url: https://github.com/cortex-md/registry/issues/new?template=report-extension.yml
    about: Problems with a community extension listed in the Marketplace go to the registry.
  - name: Report a security vulnerability
    url: https://github.com/cortex-md/cortex-app/security/advisories/new
    about: Report vulnerabilities privately. Do not open a public issue.
  - name: Contribution guide
    url: https://github.com/cortex-md/cortex-app/blob/main/CONTRIBUTING.md
    about: Read the local setup, validation, and pull request workflow.
  - name: Development documentation
    url: https://github.com/cortex-md/cortex-app/blob/main/docs/development/README.md
    about: Read desktop development and architecture practices.
