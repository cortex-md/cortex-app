name: Suggest an idea
description: Propose a feature or an improvement. Others vote on it with a thumbs up.
title: "[Idea]: "
labels: ["enhancement", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Before opening a new idea, [search the open ideas](https://github.com/cortex-md/cortex-app/issues?q=is%3Aissue+is%3Aopen+label%3Aenhancement+sort%3Areactions-%2B1-desc). If it already exists, vote with a 👍 reaction on the issue instead of commenting "+1".

        The most voted ideas are the first to be considered for the [public roadmap](https://cortex-md.tech/roadmap).
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What workflow, limitation, or need should this solve? The first paragraph is shown on the roadmap if the idea is picked up.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: What would you like Cortex to do?
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Editor and writing
        - Organize (tags, properties, databases)
        - Search and navigation
        - Sync and account
        - Mobile
        - Plugins and themes
        - CLI
        - Website and docs
        - Other
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: What workarounds or different approaches did you consider?
  - type: dropdown
    id: contribution
    attributes:
      label: Contribution interest
      options:
        - I can help implement this
        - I can help test this
        - I am only suggesting the idea
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Add screenshots, examples, links, or constraints.
