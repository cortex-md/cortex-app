name: Documentation
description: Report missing, outdated, or confusing documentation.
title: "[Docs]: "
labels: ["documentation", "needs-triage"]
body:
  - type: input
    id: page
    attributes:
      label: Page
      description: Link to the page or file.
      placeholder: https://cortex-md.tech/docs/...
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What is wrong or missing?
    validations:
      required: true
  - type: textarea
    id: suggestion
    attributes:
      label: Suggested change
      description: Optional wording, example, or section you would add.
