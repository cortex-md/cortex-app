name: Desktop Performance

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'apps/mobile/**'
      - 'apps/web/**'
      - 'docs/**'
  workflow_dispatch:
    inputs:
      scale:
        description: "Fixture scale"
        required: false
        default: smoke
        type: choice
        options:
          - smoke
          - roadmap

permissions:
  contents: read

concurrency:
  group: perf-${{ github.ref }}
  cancel-in-progress: true

env:
  SCALE: ${{ inputs.scale || 'smoke' }}

jobs:
  perf:
    name: Performance budgets
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.3

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Cache Bun dependencies
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build desktop
        run: bun run build

      - name: Measure
        run: xvfb-run --auto-servernum bun run perf -- --scale "$SCALE" --json "$GITHUB_WORKSPACE/perf-${{ github.sha }}.json"

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: perf-${{ env.SCALE }}-${{ github.sha }}
          path: perf-${{ github.sha }}.json
          if-no-files-found: ignore
