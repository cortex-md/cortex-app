name: CI

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
    paths:
      - '.github/workflows/ci.yml'
      - 'AGENTS.md'
      - 'apps/desktop/**'
      - 'packages/commands/**'
      - 'packages/core/**'
      - 'packages/editor/**'
      - 'packages/hotkeys/**'
      - 'packages/ipc/**'
      - 'packages/marketplace/**'
      - 'packages/platform/**'
      - 'packages/plugin-api/**'
      - 'packages/plugin-host-core/**'
      - 'packages/plugin-host-web/**'
      - 'packages/properties/**'
      - 'packages/renderer/**'
      - 'packages/search/**'
      - 'packages/settings/**'
      - 'packages/sync-engine/**'
      - 'packages/templates/**'
      - 'packages/theme/**'
      - 'packages/ui/**'
      - 'plugins/github-emoji/**'
      - 'scripts/*.mjs'
      - 'tools/benchmarks/**'
      - 'biome.json'
      - 'bun.lock'
      - 'package.json'
      - 'tsconfig.desktop.json'
      - 'tsconfig.json'
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/ci.yml'
      - 'AGENTS.md'
      - 'apps/desktop/**'
      - 'packages/commands/**'
      - 'packages/core/**'
      - 'packages/editor/**'
      - 'packages/hotkeys/**'
      - 'packages/ipc/**'
      - 'packages/marketplace/**'
      - 'packages/platform/**'
      - 'packages/plugin-api/**'
      - 'packages/plugin-host-core/**'
      - 'packages/plugin-host-web/**'
      - 'packages/properties/**'
      - 'packages/renderer/**'
      - 'packages/search/**'
      - 'packages/settings/**'
      - 'packages/sync-engine/**'
      - 'packages/templates/**'
      - 'packages/theme/**'
      - 'packages/ui/**'
      - 'plugins/github-emoji/**'
      - 'scripts/*.mjs'
      - 'tools/benchmarks/**'
      - 'biome.json'
      - 'bun.lock'
      - 'package.json'
      - 'tsconfig.desktop.json'
      - 'tsconfig.json'

jobs:
  desktop:
    name: Desktop — Biome, types, tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.3

      - name: Cache Bun dependencies
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('**/bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Biome lint
        run: bun run lint

      - name: Biome check
        run: bun run check

      - name: TypeScript
        run: bun run typecheck

      - name: Workspace boundaries
        run: bun run check:boundaries

      - name: Vitest
        run: bun run test:desktop:frontend

      - name: Sync engine tests
        run: bun run test:sync-engine
