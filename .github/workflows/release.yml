name: Release Desktop

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g., 0.1.0)'
        required: false
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  release-metadata:
    name: Release metadata
    runs-on: ubuntu-22.04
    outputs:
      tag_name: ${{ steps.version.outputs.tag_name }}
      version: ${{ steps.version.outputs.version }}
      is_prerelease: ${{ steps.version.outputs.is_prerelease }}
    steps:
      - uses: actions/checkout@v4

      - name: Resolve release version
        id: version
        env:
          RELEASE_VERSION_INPUT: ${{ github.event.inputs.version }}
        run: |
          node scripts/release/resolve-desktop-release-metadata.mjs

  wait-for-ci:
    name: Wait for CI
    needs: release-metadata
    runs-on: ubuntu-22.04
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Wait for CI workflow to pass
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.release-metadata.outputs.tag_name }}
        run: |
          node scripts/release/wait-for-ci-workflow.mjs

  build-electron:
    name: Build ${{ matrix.name }}
    needs:
      - release-metadata
      - wait-for-ci
    runs-on: ${{ matrix.platform }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS Apple Silicon
            platform: macos-15
            electron_args: --mac --arm64
          - name: Windows
            platform: windows-latest
            electron_args: --win --x64
          - name: Ubuntu
            platform: ubuntu-22.04
            electron_args: --linux --x64
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.3

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build desktop
        run: bun run --cwd apps/desktop build

      - name: Package
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bun run --cwd apps/desktop pack -- ${{ matrix.electron_args }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: cortex-${{ matrix.platform }}
          path: apps/desktop/release/**/*
          if-no-files-found: error

  publish-release:
    name: Publish GitHub Release
    needs:
      - release-metadata
      - build-electron
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.release-metadata.outputs.tag_name }}
          name: Cortex ${{ needs.release-metadata.outputs.version }}
          prerelease: ${{ needs.release-metadata.outputs.is_prerelease == 'true' }}
          files: artifacts/**/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
