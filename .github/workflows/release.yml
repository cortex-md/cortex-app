name: Release Desktop

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g., 0.1.0)'
        required: false
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  release-metadata:
    name: Release metadata
    runs-on: ubuntu-22.04
    outputs:
      tag_name: ${{ steps.version.outputs.tag_name }}
      version: ${{ steps.version.outputs.version }}
      is_prerelease: ${{ steps.version.outputs.is_prerelease }}
    steps:
      - uses: actions/checkout@v4

      - name: Resolve release version
        id: version
        env:
          RELEASE_VERSION_INPUT: ${{ github.event.inputs.version }}
        run: |
          node scripts/release/resolve-desktop-release-metadata.mjs

  build-electron:
    name: Build ${{ matrix.name }}
    needs:
      - release-metadata
    runs-on: ${{ matrix.platform }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS Apple Silicon
            platform: macos-15
            electron_args: --mac --arm64
          - name: Windows
            platform: windows-latest
            electron_args: --win --x64
          - name: Ubuntu
            platform: ubuntu-22.04
            electron_args: --linux --x64
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.3

      - name: Cache Bun dependencies
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Apply release version
        env:
          RELEASE_VERSION: ${{ needs.release-metadata.outputs.version }}
        run: node scripts/release/apply-desktop-release-version.mjs

      - name: Validate sync release config
        env:
          CORTEX_SYNC_SERVER_URL: ${{ vars.CORTEX_SYNC_SERVER_URL }}
          CORTEX_BILLING_URL: ${{ vars.CORTEX_BILLING_URL }}
        run: node scripts/release/validate-desktop-sync-config.mjs

      - name: Build desktop
        env:
          CORTEX_SYNC_SERVER_URL: ${{ vars.CORTEX_SYNC_SERVER_URL }}
          CORTEX_BILLING_URL: ${{ vars.CORTEX_BILLING_URL }}
        run: bun run --cwd apps/desktop build

      - name: Package
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_LINK: ${{ secrets.MAC_CERTIFICATE_P12 }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          IS_PRERELEASE: ${{ needs.release-metadata.outputs.is_prerelease }}
        run: |
          args=(${{ matrix.electron_args }})
          if [ "$RUNNER_OS" != "macOS" ]; then
            unset CSC_LINK CSC_KEY_PASSWORD APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID
          elif [ -n "$CSC_LINK" ] && [ -n "$APPLE_ID" ] && [ -n "$APPLE_TEAM_ID" ]; then
            args+=(-c.mac.notarize=true)
          elif [ "$IS_PRERELEASE" = "true" ]; then
            echo "::warning::Unsigned macOS prerelease: auto-update and notifications will not work on macOS."
            unset CSC_LINK CSC_KEY_PASSWORD
            export CSC_IDENTITY_AUTO_DISCOVERY=false
            args+=(-c.mac.identity=- -c.mac.hardenedRuntime=false)
          else
            echo "::error::Stable macOS releases need MAC_CERTIFICATE_P12, MAC_CERTIFICATE_PASSWORD, APPLE_ID, APPLE_APP_SPECIFIC_PASSWORD and APPLE_TEAM_ID."
            exit 1
          fi
          bun run --cwd apps/desktop pack -- "${args[@]}"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: cortex-${{ matrix.platform }}
          path: apps/desktop/release/**/*
          if-no-files-found: error

  publish-release:
    name: Publish GitHub Release
    needs:
      - release-metadata
      - build-electron
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.release-metadata.outputs.tag_name }}
          name: Cortex ${{ needs.release-metadata.outputs.version }}
          prerelease: ${{ needs.release-metadata.outputs.is_prerelease == 'true' }}
          files: artifacts/**/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
